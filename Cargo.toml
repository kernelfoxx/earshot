[workspace]
resolver = "3"
members = ["crates/tunelog-core", "crates/tunelog-media", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kernelfoxx/earshot"
rust-version = "1.85"

[workspace.dependencies]
tunelog-core = { path = "crates/tunelog-core", default-features = false }
tunelog-media = { path = "crates/tunelog-media" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
