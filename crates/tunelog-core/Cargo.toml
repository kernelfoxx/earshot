[package]
name = "tunelog-core"
description = "Platform-independent domain logic for TuneLog: models, normalization, tracking, storage, stats."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
serde_json.workspace = true
csv = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[features]
default = ["storage"]
# SQLite storage; off for crates that only need the domain types.
storage = ["dep:rusqlite"]

[dev-dependencies]
chrono-tz = "0.10"
